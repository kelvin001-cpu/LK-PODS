<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LK PODS</title>
<style>
:root{--bg:#0a0a0f;--cd:#16161f;--tx:#f4f4f8;--mu:#9d9db0;--ac:#a855f7;--g:#22e3a0;--bd:#2b2b3a;--rd:#ff4d6d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-2}#ov{position:fixed;inset:0;background:#0a0a0f;z-index:-1}
.w{max-width:900px;margin:0 auto;padding:12px 14px 110px}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--ac),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sub{color:var(--mu);font-size:12px}
button,.b{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--cd);color:var(--tx);cursor:pointer;border:1px solid var(--bd);text-decoration:none;display:inline-block;text-align:center}
.pr{background:linear-gradient(90deg,var(--ac),#6d5dfc);border:0;font-weight:700}.gr{background:var(--g);color:#04130d;border:0;font-weight:800}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:#0e0e15;color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.chip{white-space:nowrap;border-radius:99px;padding:7px 14px;font-size:13px}.chip.on{background:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:rgba(22,22,31,.88);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer}
.ph{aspect-ratio:1;background:linear-gradient(135deg,#2a1450,#0f3a30);display:flex;align-items:center;justify-content:center;font-size:54px}.ph img{width:100%;height:100%;object-fit:cover}
.ci{padding:10px}.ci b{display:block}.pz{color:var(--g);font-weight:800;font-size:17px}.pp{font-size:12px;color:#ffd166}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#13131b;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;border:1px solid var(--bd)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.q{display:flex;align-items:center;gap:8px}.q button{padding:6px 12px}.q span{min-width:22px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:10;background:linear-gradient(transparent,#0a0a0f 40%)}
.bar button{width:100%;max-width:900px;display:block;margin:auto;padding:14px;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--ac);border-color:var(--ac)}
.box{background:rgba(22,22,31,.92);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.lo{color:#ffd166}.out{color:var(--rd)}.k{display:flex;gap:8px;margin-bottom:12px}.k div{flex:1;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.k b{font-size:22px;display:block}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#222}
.tot{display:flex;justify-content:space-between;padding:4px 0}.gate{position:fixed;inset:0;z-index:50;background:#0a0a0f;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#04130d;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;display:none}
</style></head><body>

return `<div class="w"><div class="top"><div><h1>${E(S.name)}</h1><div class="sub">Pods • entrega rápida (moto) ${R(S.fee)}</div></div></div>
<input id="qs" placeholder="🔍 Buscar produto ou sabor" value="${E(qs)}"><div class="chips">${cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-a="cat" data-v="${E(c)}">${E(c)}</button>`).join('')}</div>
<div class="grid">${ps.map(p=>{const tot=p.flv.reduce((s,f)=>s+f.q,0);return `<div class="card" data-a="open" data-v="${p.id}"><div class="ph">${ph(p)}</div><div class="ci"><b>${E(p.name)}</b><div class="pz">${R(p.price)}</div><div class="pp">2 por ${R(pair(p))}</div><div class="sub ${tot?'':'out'}">${tot?p.flv.length+' sabores':'Esgotado'}</div></div></div>`}).join('')||'<p class="sub">Nada encontrado.</p>'}</div></div>
${cnt?`<div class="bar"><button class="gr" data-a="cart">🛒 Ver carrinho (${cnt}) • ${R(L.sub)}</button></div>`:''}${sheet=='p'?pSheet():sheet=='c'?cSheet():''}${age()}`}
function age(){let ok=0;try{ok=sessionStorage.getItem('ok18')}catch(e){}return ok?'':`<div class="gate"><div><h1>${E(S.name)}</h1><p>Venda exclusiva para <b>maiores de 18 anos</b>.</p><button class="pr" data-a="ok18">Tenho 18 anos ou mais</button></div></div>`}
function pSheet(){const p=P(open);return `<div class="mask" data-a="close"><div class="sh" data-stop><div class="ph" style="aspect-ratio:2/1;border-radius:14px;overflow:hidden">${ph(p)}</div><h2 style="margin:10px 0 0">${E(p.name)}</h2><div class="pz">${R(p.price)} <span class="pp">• 2 por ${R(pair(p))}</span></div><div class="sub">Misture sabores: a cada 2 unidades vale o preço promocional.</div>
${p.flv.map(f=>{const c=cart[p.id+'|'+f.n]||0;return `<div class="row"><div>${E(f.n)}${f.q<=0?' <span class="out">(esgotado)</span>':''}</div><div class="q"><button data-a="m" data-v="${p.id}|${E(f.n)}" ${c?'':'disabled'}>−</button><span>${c}</span><button data-a="pl" data-v="${p.id}|${E(f.n)}" ${f.q>c?'':'disabled'}>+</button></div></div>`}).join('')}
<button class="pr" style="width:100%;margin-top:12px" data-a="close">Pronto</button></div></div>`}
function msg(){const L=lines(),t=L.sub+S.fee;let m=`*Pedido ${S.name}*\n\n`;L.out.forEach(x=>{m+=`*${x.p.name}* (${x.n} un • ${R(x.t)})\n`+x.its.map(i=>`  • ${i.c}x ${i.f}`).join('\n')+'\n'});return m+`\nSubtotal: ${R(L.sub)}\nEntrega (moto): ${R(S.fee)}\n*Total: ${R(t)}*\n\n👤 ${F.n}\n📍 ${F.a}\n💳 ${F.p}`}
function cSheet(){const L=lines();return `<div class="mask" data-a="close"><div class="sh" data-stop><h2 style="margin:0 0 6px">🛒 Seu pedido</h2>
${L.out.map(x=>`<div class="box"><div class="row" style="border:0"><b>${E(x.p.name)}</b><b>${R(x.t)}</b></div>${x.its.map(i=>`<div class="row"><div>${E(i.f)}</div><div class="q"><button data-a="m" data-v="${x.p.id}|${E(i.f)}">−</button><span>${i.c}</span><button data-a="pl" data-v="${x.p.id}|${E(i.f)}">+</button></div></div>`).join('')}</div>`).join('')||'<p class="sub">Carrinho vazio.</p>'}
<div class="tot"><span>Subtotal</span><span>${R(L.sub)}</span></div><div class="tot"><span>Entrega (moto)</span><span>${R(S.fee)}</span></div><div class="tot"><b>Total</b><b class="pz">${R(L.sub+S.fee)}</b></div>
<input id="fn" placeholder="Seu nome" value="${E(F.n)}" style="margin-top:8px"><input id="fa" placeholder="Endereço completo (rua, nº, bairro)" value="${E(F.a)}" style="margin-top:8px"><select id="fp" style="margin-top:8px">${['Pix','Dinheiro','Cartão (maquininha)'].map(o=>`<option ${o==F.p?'selected':''}>${o}</option>`).join('')}</select>
<a class="b gr" id="snd" style="width:100%;margin-top:12px" target="_blank" rel="noopener" href="#" data-a="send">Enviar pedido no WhatsApp ✅</a></div></div>`}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a=='close'){if(t.classList.contains('mask')&&e.target!=t)return;sheet=null}
else if(a=='ok18'){try{sessionStorage.setItem('ok18','1')}catch(x){}}
else if(a=='cat')cat=v;else if(a=='open'){open=v;sheet='p'}else if(a=='cart')sheet='c';
else if(a=='pl'){cart[v]=(cart[v]||0)+1}else if(a=='m'){cart[v]=Math.max(0,(cart[v]||0)-1);if(!lines().sub&&sheet=='c')sheet=null}
else if(a=='send'){if(!F.n||!F.a){e.preventDefault();return toast('Preencha nome e endereço')}t.href='https://wa.me/55'+S.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(msg());return}
const y=scrollY;render();scrollTo(0,y)});
document.addEventListener('input',e=>{const t=e.target;
if(t.id=='qs'){qs=t.value;const p=t.selectionStart;render();const n=$('#qs');n.focus();n.setSelectionRange(p,p)}
else if(t.id=='fn')F.n=t.value;else if(t.id=='fa')F.a=t.value;else if(t.id=='fp')F.p=t.value});
render();
</script></body></html>
